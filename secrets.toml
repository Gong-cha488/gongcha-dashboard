# Identifiants Google OAuth (à remplir après avoir obtenu le refresh token)
[google]
client_id     = "VOTRE_CLIENT_ID"
client_secret = "VOTRE_CLIENT_SECRET"
refresh_token = "VOTRE_REFRESH_TOKEN"

# IDs des fiches Google Business (à remplir avec vos vrais IDs)
[locations]
