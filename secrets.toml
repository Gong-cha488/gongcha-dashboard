FR004 = "accounts/ACCOUNT_ID/locations/LOCATION_ID_BORDEAUX"
FR005 = "accounts/ACCOUNT_ID/locations/LOCATION_ID_MARSEILLE"
FR006 = "accounts/ACCOUNT_ID/locations/LOCATION_ID_TOULOUSE"
FR007 = "accounts/ACCOUNT_ID/locations/LOCATION_ID_LILLE"
